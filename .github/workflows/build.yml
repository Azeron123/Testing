name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract game project
        run: |
          mkdir project
          unzip -q *.zip -d project
          find project -name settings.gradle.kts -print

      - name: Build APK
        run: |
          cd "$(dirname "$(find project -name settings.gradle.kts -print -quit)")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyRPG-APK
          path: project/**/build/outputs/apk/debug/*.apk
